# Vérifications à chaque push et à chaque PR : tests du serveur et compilation de l'interface.
# Aucune clé n'est utilisée : les tests ne font aucun appel réseau.
name: Vérifications

on:
  push:
  pull_request:

jobs:
  serveur:
    name: Tests du serveur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pydantic
      - name: Tri des annonces par modèle
        run: python tests/test_matching.py
      - name: Bloc eBay (réponse simulée)
        run: python tests/test_ebay.py

  interface:
    name: Compilation de l'interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
